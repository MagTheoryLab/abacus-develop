name: NCGGA LibXC compatibility reproduction

on:
  push:
    branches: [codex/ci-ncgga-libxc]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/deepmodeling/abacus-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # We will handle submodules manually after fixing ownership
          submodules: 'false'

      - name: Take ownership of the workspace and update submodules
        run: |
          sudo chown -R $(whoami) .
          git submodule update --init --recursive

      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            ccache \
            ca-certificates \
            pkg-config \
            python-is-python3 \
            python3-pip \
            ninja-build \
            xz-utils
          sudo pip install clang-format clang-tidy

      - name: Install external tools from toolchain
        run: |
          cd toolchain
          ./install_abacus_toolchain_new.sh --with-dftd4=install --dry-run -j8
          ./scripts/stage4/install_stage4.sh
          cd ..

      - name: Configure
        run: |
          source toolchain/install/setup
          cmake -B build -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_MLALGO=ON \
            -DENABLE_LIBXC=ON \
            -DENABLE_LIBRI=ON \
            -DENABLE_GOOGLEBENCH=ON \
            -DENABLE_RAPIDJSON=ON \
            -DENABLE_FLOAT_FFTW=ON \
            -DENABLE_DFTD4=ON \
            -DENABLE_PEXSI=ON \
            -Werror=dev

# Temporarily removed because no one maintains this now.
# And it will break the CI test workflow.

#      - uses: pre-commit/action@v3.0.1
#        with:
#          extra_args:
#            --from-ref ${{ github.event.pull_request.base.sha }}
#              --to-ref ${{ github.event.pull_request.head.sha }}
#        continue-on-error: true
#      - uses: pre-commit-ci/lite-action@v1.0.3

      - name: Build corrected tests
        run: cmake --build build -j2 --target MODULE_HAMILT_XCTest_NCGGA_DISCRETE_FD
      - name: Run corrected serial and MPI2 tests
        env:
          OMP_NUM_THREADS: 1
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
        run: ctest --test-dir build -V -R '^MODULE_HAMILT_XCTest_NCGGA_DISCRETE_FD(_MPI2)?$'
      - name: Reproduce original zero-omega failure
        env:
          OMP_NUM_THREADS: 1
        run: |
          sed -i 's/test_hse_omega = 0.11/test_hse_omega = 0.0/' source/source_hamilt/module_xc/test/test_xc_functional_ncgga_sf.cpp
          cmake --build build -j2 --target MODULE_HAMILT_XCTest_NCGGA_DISCRETE_FD
          set +e
          ctest --test-dir build -V -R '^MODULE_HAMILT_XCTest_NCGGA_DISCRETE_FD$' > zero-omega.log 2>&1
          result=$?
          set -e
          cat zero-omega.log
          test "$result" -ne 0
          grep -q 'LibxcGgaGrad2StressAggregatesPublicFunctionalScaling' zero-omega.log
          grep -qi 'nan' zero-omega.log
